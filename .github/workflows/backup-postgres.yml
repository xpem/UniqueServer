name: Backup Postgres

on:
  schedule:
    - cron: '0 2 */5 * *' # A cada 5 dias às 02:00 UTC
  push:
    branches:
      - run-backup # Push nessa branch para disparar manualmente

env:
  BACKUP_DIR: /var/backups/postgres
  RETENTION_COUNT: 10
  RCLONE_REMOTE: gdrive:Backups/postgres

jobs:
  backup:
    if: "!contains(github.server_url, 'github.com')"
    runs-on: ubuntu-latest

    steps:
      - name: Executar backup Postgres
        env:
          PGPASSWORD: ${{ secrets.DB_PASS }}
        run: |
          set -euo pipefail

          mkdir -p ${{ env.BACKUP_DIR }}

          DATE=$(date +%Y-%m-%d_%H-%M-%S)
          BACKUP_FILE="${{ env.BACKUP_DIR }}/all_databases_$DATE.sql.gz"

          pg_dumpall \
            -h "${{ secrets.DB_HOST }}" \
            -U "${{ secrets.DB_USER }}" | gzip > "$BACKUP_FILE"

          echo "Backup criado: $BACKUP_FILE ($(du -h "$BACKUP_FILE" | cut -f1))"

          echo "BACKUP_FILE=$BACKUP_FILE" >> $GITHUB_ENV

      - name: Enviar backup para Google Drive
        run: |
          set -euo pipefail
          rclone copy "${{ env.BACKUP_FILE }}" ${{ env.RCLONE_REMOTE }}/ --progress
          echo "Backup enviado para Google Drive"

      - name: Limpar backups locais antigos
        run: |
          ls -t ${{ env.BACKUP_DIR }}/all_databases_*.sql.gz \
            | tail -n +$(( ${{ env.RETENTION_COUNT }} + 1 )) \
            | xargs -r rm --
